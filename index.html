<html lang="en">
  <head>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turiya Infotech" />
    <meta property="og:url" content="https://turiyainfotech.com/" />
    <meta property="og:title" content="Turiya Infotech | Smarter Digital Systems &amp; Business Communication" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turiya Infotech | Smarter Digital Systems &amp; Business Communication" />
    <meta name="twitter:description" content="Adopt smarter digital systems with WhatsApp Business API, SMS Solutions, RCS Messaging, Chatbots, and Custom Software Development by Turiya Infotech." />
    <meta name="twitter:image" content="https://turiyainfotech.com/og-image.png" />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Turiya Infotech",
        "alternateName": "Turiya Infotech Private Limited",
        "url": "https://turiyainfotech.com",
        "logo": "https://turiyainfotech.com/favicon-192x192.png",
        "email": "business@turiyainfotech.com",
        "description": "Turiya Infotech provides WhatsApp Business API, SMS Solutions, RCS Messaging, chatbot development, campaign communication, and custom software development solutions.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Nashik",
          "addressRegion": "Maharashtra",
          "postalCode": "422101",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-70202-62435",
          "email": "business@turiyainfotech.com",
          "contactType": "sales",
          "areaServed": "IN",
          "availableLanguage": ["en", "hi", "mr"]
        },
        "sameAs": [
          "https://www.linkedin.com/company/turiya-infotech/",
          "https://www.instagram.com/turiya.infotech/"
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family:sans-serif;padding:24px">Turiya Infotech needs JavaScript to display this site. You can reach us at business@turiyainfotech.com or +91 70202 62435.</p>
    </noscript>

    <!--
      Static copies of the site's forms so Netlify Forms can detect them at deploy time.
      The React forms submit to these via fetch (see src/utils/submitForm.ts). Keep field names in sync.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" />
      <input name="email" />
      <input name="company" />
      <input name="mobile" />
      <input name="serviceRequired" />
      <input name="industry" />
      <textarea name="message"></textarea>
      <input name="source" />
    </form>
    <form name="demo-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="company" />
      <input name="solution" />
      <input name="date" />
      <input name="timeSlot" />
      <textarea name="notes"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
